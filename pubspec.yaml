name: focus_wave
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  audioplayers: ^6.7.1
  file_picker: ^8.0.0      # 🟢 追加：ファイル選択用
  hive_flutter: ^1.1.0     # 🟢 追加：ローカルストレージ（バイナリ保存用）

dev_dependencies:
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/audio/rain.mp3
    - assets/audio/fire.mp3
    - assets/audio/cafe.mp3
    - assets/audio/wave.mp3
    - assets/audio/alert.mp3
    - assets/icon/app_icon.png  # 🟢 ここを追加
    